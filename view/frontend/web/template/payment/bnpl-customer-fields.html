<!-- Customer data of the PAYONE Buy Now Pay Later methods (bnpl-base.js), included in the fieldset of the method form -->
<div class="field required">
    <label data-bind="attr: {for: getCode() + '_dateofbirth'}" class="label">
        <span><!-- ko i18n: 'Date of birth'--><!-- /ko --></span>
    </label>
    <div class="control">
        <input type="date" name="payment[dateofbirth]" class="input-text" style="width:auto;"
               data-bind="attr: {
                    id: getCode() + '_dateofbirth',
                    max: getMaxDateOfBirth(),
                    'data-container': getCode() + '-dateofbirth'},
              value: dateOfBirth">
    </div>
</div>

<!-- ko if: requestTelephone() -->
<div class="field required">
    <label data-bind="attr: {for: getCode() + '_telephone'}" class="label">
        <span><!-- ko i18n: 'Phone Number'--><!-- /ko --></span>
    </label>
    <div class="control">
        <input type="tel" name="payment[telephone]" class="input-text"
               data-bind="attr: {
                    autocomplete: 'tel',
                    id: getCode() + '_telephone',
                    'data-container': getCode() + '-telephone'},
              value: telephone,
              valueUpdate: 'keyup'">
    </div>
</div>
<!--/ko-->
